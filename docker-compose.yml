version: '3.8'

services:
  farmgate-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: farmgate_platform
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
